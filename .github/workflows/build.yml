name: build

# A v* tag push = release. The workflow builds the tagged sources with the
# same csc call as build.bat and attaches the plain universal exe to the
# release (no zip archive). The AnyCPU build runs as a 64-bit process on
# 64-bit Windows and as a 32-bit one on 32-bit Windows, so one file covers
# everything.
# GitHub's automatic Source code archives are on the release as well.
# The release is created with the preinstalled gh CLI (no third-party action:
# action resolution kept failing on the runner).
on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-and-release:
    # windows-2022 pinned: windows-latest moved to a newer image and a run
    # died in "Set up job" before any step executed.
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The build also serves as build verification: a failing run fails the
      # whole workflow. NOTE: build.bat MUST be invoked with "call" - a bare
      # batch invocation from a multi-line cmd script transfers control and
      # never returns.
      - name: Build the universal exe (same as build.bat)
        shell: cmd
        run: |
          call build.bat || exit /b 1
          dir Tilettes*.exe

      # Checksums travel with the release: users can verify what they downloaded
      # and analysts can whitelist faster. The sums are also appended to the
      # release notes below the changelog text.
      - name: Compute SHA256 checksums
        shell: bash
        run: |
          sha256sum Tilettes.exe > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create release and attach the exe (tag builds only)
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Notes = CHANGELOG.md + a SHA256 block built from SHA256SUMS.txt
          cp CHANGELOG.md release_notes.md
          printf '\n## SHA256\n```\n' >> release_notes.md
          cat SHA256SUMS.txt >> release_notes.md
          printf '```\n' >> release_notes.md
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # edit: refresh the title and the notes from CHANGELOG.md (older gh
            # on the runner has no --generate-notes, the notes file is used
            # instead on both paths).
            gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "Tilettes $GITHUB_REF_NAME" --notes-file release_notes.md
            gh release upload "$GITHUB_REF_NAME" "Tilettes.exe" "SHA256SUMS.txt" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "Tilettes.exe" "SHA256SUMS.txt" --repo "$GITHUB_REPOSITORY" --title "Tilettes $GITHUB_REF_NAME" --notes-file release_notes.md
          fi
