name: build

# A v* tag push = release. The workflow verifies that the tagged sources
# compile (same csc call as build.bat), packs a portable zip (Tilettes.exe +
# README.md + LICENSE) and attaches it to the release; GitHub's automatic
# Source code archives are on the release as well.
# The release is created with the preinstalled gh CLI (no third-party action:
# action resolution kept failing on the runner).
on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-and-release:
    # windows-2022 pinned: windows-latest moved to a newer image and a run
    # died in "Set up job" before any step executed.
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify build (csc.exe, same as build.bat)
        shell: cmd
        run: build.bat

      - name: Pack portable zip (exe + README + LICENSE)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item Tilettes.exe dist/
          Copy-Item README.md dist/
          Copy-Item LICENSE dist/
          $zip = "Tilettes-$($env:GITHUB_REF_NAME).zip"
          Compress-Archive -Path dist/* -DestinationPath $zip -Force
          Remove-Item -Recurse -Force dist

      - name: Create release and attach zip (tag builds only)
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # edit: the older gh on the runner has no --generate-notes here;
            # the notes were already generated when the release was created.
            gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "Tilettes $GITHUB_REF_NAME"
            gh release upload "$GITHUB_REF_NAME" "Tilettes-$GITHUB_REF_NAME.zip" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "Tilettes-$GITHUB_REF_NAME.zip" --repo "$GITHUB_REPOSITORY" --title "Tilettes $GITHUB_REF_NAME" --generate-notes
          fi
