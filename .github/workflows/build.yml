name: build

# A v* tag push = release. The workflow verifies that the tagged sources
# compile (same csc call as build.bat) and creates the release; the release
# contains only GitHub's automatic source archives (Source code zip/tar.gz) —
# no built exe is attached, users build it themselves with build.bat.
# The release is created with the preinstalled gh CLI (no third-party action:
# action resolution kept failing on the runner).
on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-and-release:
    # windows-2022 pinned: windows-latest moved to a newer image and a run
    # died in "Set up job" before any step executed.
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify build (csc.exe, same as build.bat)
        shell: cmd
        run: build.bat

      - name: Create release with source archive (tag builds only)
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "Tilettes $GITHUB_REF_NAME" --generate-notes
          else
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "Tilettes $GITHUB_REF_NAME" --generate-notes
          fi
