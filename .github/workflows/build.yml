name: build

# A v* tag push = release. The workflow builds the tagged sources with the
# same csc call as build.bat and attaches plain exe files to the release
# (no zip archive): the universal AnyCPU build plus x86 and x64 variants.
# GitHub's automatic Source code archives are on the release as well.
# The release is created with the preinstalled gh CLI (no third-party action:
# action resolution kept failing on the runner).
on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-and-release:
    # windows-2022 pinned: windows-latest moved to a newer image and a run
    # died in "Set up job" before any step executed.
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Three csc builds also serve as the build verification: any failing
      # run fails the whole workflow. NOTE: every build.bat MUST be invoked
      # with "call" - a bare batch invocation from a multi-line cmd script
      # transfers control and never returns, so the x86/x64 lines silently
      # never ran (v0.6beta's first run shipped without them for exactly
      # this reason).
      - name: Build exes (AnyCPU universal + x86 + x64, same as build.bat)
        shell: cmd
        run: |
          call build.bat || exit /b 1
          call build.bat x86 || exit /b 1
          call build.bat x64 || exit /b 1
          dir Tilettes*.exe

      - name: Create release and attach exes (tag builds only)
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # edit: refresh the title and the notes from CHANGELOG.md (older gh
            # on the runner has no --generate-notes, the notes file is used
            # instead on both paths).
            gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "Tilettes $GITHUB_REF_NAME" --notes-file CHANGELOG.md
            gh release upload "$GITHUB_REF_NAME" "Tilettes.exe" "Tilettes-x86.exe" "Tilettes-x64.exe" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "Tilettes.exe" "Tilettes-x86.exe" "Tilettes-x64.exe" --repo "$GITHUB_REPOSITORY" --title "Tilettes $GITHUB_REF_NAME" --notes-file CHANGELOG.md
          fi
